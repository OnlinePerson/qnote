name: Deploy ZooBoom

on:
  push:
    branches: [main]
    paths:
      - 'zooboom/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            set -e

            echo "===== SETUP ====="
            if [ ! -d /opt/zooboom ]; then
              git clone https://github.com/OnlinePerson/qnote.git /opt/zooboom
            fi
            cd /opt/zooboom

            echo "===== FETCH ====="
            git fetch origin main
            git reset --hard origin/main
            git log --oneline -1

            echo "===== ENV ====="
            if [ ! -f /opt/zooboom/zooboom/.env ]; then
              echo "ERROR: /opt/zooboom/zooboom/.env not found. Create it from .env.example first."
              exit 1
            fi

            echo "===== BUILD ====="
            cd /opt/zooboom/zooboom
            docker compose build zoo-bot zoo-api

            echo "===== UP ====="
            docker compose up -d --force-recreate zoo-bot zoo-api

            echo "===== NGINX ====="
            cp nginx/zoo.conf /etc/nginx/sites-enabled/zoo.conf 2>/dev/null \
              || cp nginx/zoo.conf /etc/nginx/conf.d/zoo.conf 2>/dev/null \
              || true
            nginx -s reload 2>/dev/null \
              || service nginx reload 2>/dev/null \
              || systemctl reload nginx 2>/dev/null \
              || echo "WARN: nginx reload skipped"

            echo "===== STATUS ====="
            docker compose ps
