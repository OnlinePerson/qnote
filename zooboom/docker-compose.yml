version: '3.8'

services:
  zoo-bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    env_file: .env
    volumes:
      - zoo-data:/data
    restart: unless-stopped

  zoo-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    volumes:
      - zoo-data:/data
    ports:
      - "8001:8001"
    restart: unless-stopped

volumes:
  zoo-data:
